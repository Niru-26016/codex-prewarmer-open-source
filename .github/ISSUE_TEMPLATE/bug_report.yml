name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: Do not include passwords, authentication files, runner tokens, private keys or deployment logs containing secrets. For vulnerabilities, follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the execution mode and browser or operating system.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include only redacted error messages or screenshots.
    validations:
      required: true
